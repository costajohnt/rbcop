[package]
name = "rbcop"
version = "0.1.2"
description = "RuboCop reimplemented in Rust, aiming for byte-identical output"
repository = "https://github.com/costajohnt/rbcop"
readme = "README.md"
# let chains (`if let ... && let ...`) need 1.88.
rust-version = "1.88"
# Not publishable: the [patch] below points at vendor/ruby-prism, which `cargo package` drops.
publish = false
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
fancy-regex = "0.14.0"
regex = "1.13.1"
ruby-prism = "1.9.0"
ruby-prism-sys = "1.9.0"

# musl's allocator serializes rbcop's worker threads (several times slower than glibc's).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

# Vendored with an added parse_with_version (see vendor/ruby-prism/src/lib.rs, "rbcop patch").
[patch.crates-io]
ruby-prism = { path = "vendor/ruby-prism" }

# Thin LTO: ~9% fewer cycles linting discourse (#388), for ~5 s more per release rebuild.
[profile.release]
lto = "thin"
