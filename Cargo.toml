[package]
name = "rbcop"
version = "0.1.4"
description = "RuboCop reimplemented in Rust, aiming for byte-identical output"
repository = "https://github.com/costajohnt/rbcop"
readme = "README.md"
# `if let` match guards need 1.95 (1.94 rejects them); ci.yml checks this version builds.
rust-version = "1.95"
# Not publishable: the [patch] below points at vendor/ruby-prism, which `cargo package` drops.
publish = false
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
fancy-regex = "0.20.1"
regex = "1.13.1"
ruby-prism = "1.9.0"
ruby-prism-sys = "1.9.0"
# AllCops/UseProjectIndex (#295): RuboCop builds its project index with the rubydex gem;
# vendor/rubydex is that gem's Rust core, so the index resolves exactly as RuboCop's does.
rubydex = { path = "vendor/rubydex" }
# The result cache's build digest (src/cache.rs); already built for rubydex.
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

# musl's allocator serializes rbcop's worker threads (several times slower than glibc's), and
# mimalloc also beats glibc's malloc on Linux (#781).
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

# Vendored with an added parse_with_version (see vendor/ruby-prism/src/lib.rs, "rbcop patch"): the
# crates.io crate plus vendor/ruby-prism.patches (scripts/prism-patch.sh).
[patch.crates-io]
ruby-prism = { path = "vendor/ruby-prism" }

# Thin LTO: ~9% fewer cycles linting discourse (#388), for ~5 s more per release rebuild.
# Release archives build with fat LTO instead (scripts/dist/build.sh, #781).
[profile.release]
lto = "thin"
