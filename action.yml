name: rbcop
description: Run rbcop, RuboCop 1.91 reimplemented in Rust, from a cached, checksum-verified release binary
author: John Costa
branding:
  icon: check-circle
  color: red

# The archive's SHA-256 is pinned in this repository (packaging/checksums/<version>.sha256) and
# checked on every run, cache hits included, before the binary is extracted; a missing entry or a
# mismatch fails the step. Only the downloaded archive is cached, never the extracted binary.

inputs:
  version:
    description: rbcop release to run (default the version of this action's ref, from its Cargo.toml)
    default: ''
  args:
    description: Arguments for rbcop, split on whitespace (empty to only install rbcop on PATH)
    default: --format github --format progress
  fallback:
    description: >-
      Run cops rbcop does not implement (plugin and custom cops) with RuboCop: auto (when one is
      found, for example installed by ruby/setup-ruby with bundler-cache), true (RBCOP_FALLBACK=1)
      or false (RBCOP_FALLBACK=0). auto runs RuboCop, and so the repository's Ruby code, when the
      config needs it.
    default: auto
  rubocop:
    description: >-
      The RuboCop command for the fallback (RBCOP_RUBOCOP); empty finds one: bundle exec rubocop
      when Gemfile.lock has rubocop, else rubocop on PATH
    default: ''

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$VERSION" ]; then
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -1)
        fi
        if ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
          echo "rbcop: not a release version: $VERSION" >&2
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "archives=$RUNNER_TOOL_CACHE/rbcop/$VERSION/$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.version.outputs.archives }}
        key: rbcop-archive-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        RBCOP_ARCHIVE_CACHE: ${{ steps.version.outputs.archives }}
      run: |
        sh "$GITHUB_ACTION_PATH/scripts/dist/install.sh" "$VERSION" "$RUNNER_TEMP/rbcop-bin"
        echo "$RUNNER_TEMP/rbcop-bin" >> "$GITHUB_PATH"
    - if: inputs.args != ''
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        RBCOP_FALLBACK: ${{ inputs.fallback == 'true' && '1' || inputs.fallback == 'false' && '0' || '' }}
        RBCOP_RUBOCOP: ${{ inputs.rubocop }}
      run: |
        set -f
        rbcop $ARGS
