# The fast tier of scripts/ci.sh on every pull request and every push to master: cargo fmt
# --check, clippy -D warnings, build and cargo test, all --release --locked. The corpus tier
# (check-cops, check-cold, check-plugins) needs the corpora and oracles of the self-hosted CI host
# and stays there (docs/porting-cops.md).
#
# Some tests run the real RuboCop: the fallback, scenarios that `require` a plugin, the gate-script
# checks. They get RuboCop 1.92.2 and the plugin pins of docs/plugins.md, each gem installed at an
# exact version with --ignore-dependencies, so nothing resolves differently from run to run.
#
# Hardening, as in release.yml: actions pinned to commit SHAs, a read-only token, no credentials
# persisted, no caches, no event data interpolated into scripts. `pull_request` (never
# `pull_request_target`) runs a fork's code without secrets.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # rubocop 1.92.2 and its dependencies, then the plugin pins (docs/plugins.md) and theirs. The
  # versions `-V` names must match src/config/mod.rs and docs/plugins.md (tests/core_review.rs).
  GEMS: >-
    ast:2.4.3 json:2.18.0 language_server-protocol:3.17.0.6 lint_roller:1.1.0 parallel:2.3.0
    parser:3.3.12.0 prism:1.9.0 racc:1.8.1 rainbow:3.1.1 regexp_parser:2.13.1 rubocop-ast:1.50.0
    ruby-progressbar:1.13.0 unicode-display_width:3.3.0 unicode-emoji:4.3.0 rubocop:1.92.2
    rubocop-performance:1.27.0 rubocop-rails:2.38.0 rubocop-minitest:0.41.0 rubocop-rspec:3.10.2
    rubocop-rspec_rails:2.33.0 rubocop-factory_bot:2.28.0 rubocop-capybara:3.1.0
    activesupport:8.1.4 base64:0.3.0 bigdecimal:4.0.1 concurrent-ruby:1.3.8 connection_pool:3.0.2
    drb:2.2.3 i18n:1.15.2 logger:1.7.0 minitest:6.0.0 rack:3.2.7 securerandom:0.4.1 tzinfo:2.0.6
    uri:1.1.1

jobs:
  fast-tier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ruby from .ruby-version, the CI host's.
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
      # Rust from rust-toolchain.toml (with no argument, rustup installs that file's toolchain).
      - name: Toolchain
        run: |
          sudo apt-get install -y libclang-dev
          rustup toolchain install
          rustc --version
      - name: RuboCop 1.92.2 and plugin pins
        run: |
          set -eu
          for g in $GEMS; do
            gem install --no-document --ignore-dependencies "${g%%:*}" -v "${g#*:}"
          done
          rubocop --version
      - name: Fast tier
        run: scripts/ci.sh

  # Cargo.toml's rust-version still builds (overrides rust-toolchain.toml with `+<version>`).
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -eu
          sudo apt-get install -y libclang-dev
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --locked

  # RustSec advisories for Cargo.lock (deny.toml).
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -eu
          rustup toolchain install
          cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"
          cargo deny check advisories
