# Release: build the archives and gems for a vX.Y.Z tag and attach them to a draft GitHub release.
# Not run while the repository is private (hosted minutes); the same steps run by hand with
# scripts/dist/*.sh (docs/releasing.md).
#
# Gems are pushed only from a manual run (workflow_dispatch with `publish-gems`), through RubyGems
# trusted publishing (OIDC, no API key secret), in the `rubygems` environment, which should require
# a reviewer. The Homebrew formula (dist/rbcop.rb) is attached to the release and copied into the
# tap by hand.
#
# Hardening: third-party actions are pinned to commit SHAs; the workflow token is read-only except
# in the jobs that write; only tags and manual runs trigger it, never pull requests; no event data
# is interpolated into scripts; zig is checked against its published SHA-256 and Rust crates
# against Cargo.lock (--locked).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish-gems:
        description: Push the gems to rubygems.org after building them
        type: boolean
        default: false

permissions:
  contents: read

env:
  ZIG_VERSION: 0.13.0
  ZIG_SHA256: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
  CARGO_ZIGBUILD_VERSION: 0.23.4

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo apt-get install -y libclang-dev
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -C "$RUNNER_TEMP/zig" --strip-components=1 -xf zig.tar.xz
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          cargo install --locked "cargo-zigbuild@$CARGO_ZIGBUILD_VERSION"
      - run: sh scripts/dist/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: sh scripts/dist/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/

  package:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.4'
      - run: sh scripts/dist/gem.sh
      - run: sh scripts/dist/homebrew.sh > dist/rbcop.rb
      # The x86_64 platform gem and the `ruby` gem install and run without a Rust toolchain.
      - run: |
          for gem in dist/gems/rbcop-*-x86_64-linux-gnu.gem dist/gems/rbcop-[0-9]*[0-9].gem; do
            rm -rf "$RUNNER_TEMP/gems"
            gem install --local --no-document --install-dir "$RUNNER_TEMP/gems" "$gem"
            GEM_HOME="$RUNNER_TEMP/gems" "$RUNNER_TEMP/gems/bin/rbcop" -v
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/rbcop.rb
            dist/gems/*.gem

  draft-release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "rbcop $TAG" \
            dist/*.tar.gz dist/*.sha256 dist/rbcop.rb dist/gems/*.gem

  publish-gems:
    if: github.event_name == 'workflow_dispatch' && inputs.publish-gems
    needs: package
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.4'
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: for gem in dist/gems/*.gem; do gem push "$gem"; done
