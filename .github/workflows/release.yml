# Release: build the archives and gems for a vX.Y.Z tag and attach them to a draft GitHub release.
# Not run while the repository is private (hosted minutes); the same steps run by hand with
# scripts/dist/*.sh (see docs/releasing.md). Publishing the gems and the Homebrew formula stays
# manual: the draft release is reviewed first.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: sudo apt-get install -y libclang-dev
      - run: cargo install --locked cargo-zigbuild
      - run: sh scripts/dist/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: sh scripts/dist/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: sh scripts/dist/gem.sh
      - run: sh scripts/dist/homebrew.sh > dist/rbcop.rb
      # Smoke test: the x86_64 gem installs and runs without a Rust toolchain.
      - run: |
          gem install --install-dir "$RUNNER_TEMP/gems" dist/gems/rbcop-*-x86_64-linux-gnu.gem
          GEM_HOME="$RUNNER_TEMP/gems" "$RUNNER_TEMP/gems/bin/rbcop" -v
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "rbcop $GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.sha256 dist/gems/*.gem dist/rbcop.rb
