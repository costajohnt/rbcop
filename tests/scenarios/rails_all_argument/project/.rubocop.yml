# Rails/RedundantActiveRecordAllMethod on an `all` argument of a querying method whose receiver is
# also `.all` (#443). RuboCop reports it (its pattern checks only the parent's receiver), and its
# correction removes the argument's `all` and the parent's dot, writing `Foo.merge(Bar.)`, a syntax
# error. Deliberate difference (docs/known-gaps.md): rbcop reports the same offenses but withholds
# that correction; expected/ is rbcop's output and rubocop-output/ RuboCop's.
plugins:
  - rubocop-rails
AllCops:
  TargetRubyVersion: 3.4
  TargetRailsVersion: 8.0
  SuggestExtensions: false
  DisabledByDefault: true
Rails/RedundantActiveRecordAllMethod:
  Enabled: true
