Layout/TrailingEmptyLines:
  EnforcedStyle: final_blank_line
Layout/IndentationStyle:
  EnforcedStyle: tabs
Style/FrozenStringLiteralComment:
  EnforcedStyle: never
Style/NilComparison:
  EnforcedStyle: comparison
Layout/LineLength:
  Max: 60
  AllowHeredoc:
    - SQL
  AllowedPatterns:
    - '^\s*# '
    - !ruby/regexp /SKIP/
  URISchemes:
    - ftp
Lint/Debugger:
  DebuggerMethods:
    Custom:
      - my_debug
    Byebug: ~
  DebuggerRequires:
    - debug
